baseURL = "https://go-doom.github.io/"
title = "go-doom"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "result" is the honest one-line blurb (role + what is true).
# "kind" = the layer: engine / brand.
[[params.repos]]
  name = "engine"
  accel = "doom + seed · backend/tamago · embedwad · harvest-reference · examples"
  kind = "engine"
  result = "The DOOM engine in pure Go. Hand-port lineage: id Software 1997 source release -> AndreRenaud/gore -> go-doom/engine, with a bare-metal TamaGo backend + shareware DOOM1.WAD in-tree. CGO_ENABLED=0 on the engine path, 4-gate provable-test protocol, 6-arch CI, BSD-3 wrapper + GPL-2 engine carve-out."
[[params.repos]]
  name = "brand"
  accel = "Logos, favicons, social previews"
  kind = "brand"
  result = "Brand assets — SVG / PNG / JPG / ICO / ICNS in color, white-transparent and black-transparent variants. Drives this landing, the engine README banner, and the org avatar."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 18.11:1, bright on the dark background 2.32:1.
  base = "#330404"
  deep = "#1f0202"
  bright = "#9a1818"
  shadow = "rgba(51,4,4,.7)"
  glow = "rgba(51,4,4,.6)"
  wash = "rgba(51,4,4,.10)"
  washDeep = "rgba(31,2,2,.06)"
  chipBg = "#f3e3e3"
  chipBorder = "#e1baba"
  chipFg = "#1f0202"
  chipBgDark = "rgba(154,24,24,.14)"
  chipBorderDark = "rgba(154,24,24,.32)"
  chipFgDark = "#c78080"
  statsEnd = "#e7c8c8"
  bandText = "#efdada"

# The strip under the top bar: the code's licence and cgo, and the data
# shipped under its own licence (read from its licence files).
[params.mantra]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "engine: GPL-2.0-only"]
